<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Nexus</title>
<style>
  html,body{height:100%;margin:0;background:#1e1f22;color:#dbdee1;font-family:-apple-system,system-ui,sans-serif}
  body{display:grid;place-items:center;text-align:center;padding:24px}
  .logo{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,#2aabee,#5865f2);margin:0 auto 16px}
  button{margin-top:20px;border:0;border-radius:12px;background:#2aabee;color:#fff;font-weight:600;padding:12px 24px;font-size:16px}
</style>
</head>
<body>
  <div>
    <div class="logo"></div>
    <h2>Can't reach Nexus</h2>
    <p>Check your internet connection and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
