<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1e1f22" />
<link rel="icon" href="./icon-192.png" />
<title>Nexus</title>
<style>
  html,body{height:100%;margin:0;background:#0b0b0f;color:#dbdee1;font-family:-apple-system,system-ui,sans-serif}
  body{display:grid;place-items:center;text-align:center;padding:24px}
  .logo{width:88px;height:88px;border-radius:22px;margin:0 auto 16px;object-fit:cover;box-shadow:0 12px 40px rgba(88,101,242,.35)}
  h2{margin:0 0 8px;font-size:22px;letter-spacing:-.02em}
  p{margin:0;color:#a7abb4;line-height:1.45;max-width:28ch}
  button{margin-top:20px;border:0;border-radius:12px;background:linear-gradient(135deg,#ff2bd6,#5865f2,#00c2ff);color:#fff;font-weight:700;padding:12px 24px;font-size:16px}
</style>
<script>
  // Capgo: CapacitorUpdater.notifyAppReady() — keep OTA shell updates from rolling back
  (function () {
    function ready() {
      try {
        var C = window.Capacitor;
        var U = C && C.Plugins && C.Plugins.CapacitorUpdater;
        if (U && typeof U.notifyAppReady === "function") {
          U.notifyAppReady();
          return true;
        }
      } catch (e) {}
      return false;
    }
    if (!ready()) setTimeout(ready, 400);
  })();
</script>
</head>
<body>
  <div>
    <img class="logo" src="./icon-192.png" width="88" height="88" alt="Nexus" />
    <h2>Can't reach Nexus</h2>
    <p>Check your internet connection and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
