name: iOS app (.ipa)

# Builds an unsigned Nexus.ipa — install it with Sideloadly / AltStore using your Apple ID.
# Triggers: Actions → Run workflow, or any push to main that touches mobile/.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Live site the app opens (leave empty to use the NEXUS_URL repo variable)"
        required: false
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/ipa.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/ipa.yml"

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    env:
      NEXUS_URL: ${{ github.event.inputs.url || vars.NEXUS_URL || 'https://nexus-chat-plum.vercel.app' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Create iOS project
        run: |
          echo "App will open: $NEXUS_URL"
          npx cap add ios
          npx cap sync ios
          ls ios/App

      - name: Permissions, icon and app settings
        run: |
          PLIST=ios/App/App/Info.plist
          pb() { /usr/libexec/PlistBuddy -c "$1" "$PLIST" 2>/dev/null || true; }
          pb "Add :NSMicrophoneUsageDescription string Nexus uses your microphone for voice calls."
          pb "Add :NSCameraUsageDescription string Nexus uses your camera for video calls."
          pb "Add :NSPhotoLibraryUsageDescription string Choose photos and videos to send in chats."
          pb "Add :NSPhotoLibraryAddUsageDescription string Save photos and videos from chats."
          pb "Add :UIBackgroundModes array"
          pb "Add :UIBackgroundModes:0 string audio"
          pb "Add :UIBackgroundModes:1 string voip"
          pb "Set :CFBundleDisplayName Nexus"
          pb "Add :CFBundleDisplayName string Nexus"
          pb "Add :ITSAppUsesNonExemptEncryption bool false"
          pb "Add :UIStatusBarStyle string UIStatusBarStyleLightContent"
          pb "Add :UIViewControllerBasedStatusBarAppearance bool false"
          pb "Set :UIUserInterfaceStyle Dark"
          pb "Add :UIUserInterfaceStyle string Dark"
          pb "Set :CFBundleShortVersionString 1.${GITHUB_RUN_NUMBER}"
          pb "Add :CFBundleShortVersionString string 1.${GITHUB_RUN_NUMBER}"
          pb "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}"
          pb "Add :CFBundleVersion string ${GITHUB_RUN_NUMBER}"

          # App icon — resize the 1024 master into every AppIcon.appiconset slot
          test -f resources/icon-1024.png
          ICONSET=ios/App/App/Assets.xcassets/AppIcon.appiconset
          mkdir -p "$ICONSET"
          cp resources/AppIcon.Contents.json "$ICONSET/Contents.json"
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          src = Path("resources/icon-1024.png")
          iconset = Path("ios/App/App/Assets.xcassets/AppIcon.appiconset")
          data = json.loads((iconset / "Contents.json").read_text())
          for img in data["images"]:
              w, h = img["size"].split("x")
              scale = int(img["scale"].replace("x", ""))
              px = int(round(float(w) * scale))
              out = iconset / img["filename"]
              subprocess.check_call(["sips", "-z", str(px), str(px), str(src), "--out", str(out)], stdout=subprocess.DEVNULL)
              print(out.name, px)
          PY
          ls -la "$ICONSET"
          plutil -p "$PLIST" | head -60

      - name: Build (unsigned)
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            MARKETING_VERSION="1.${GITHUB_RUN_NUMBER}" CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            | tail -40
          test -d build/App.xcarchive/Products/Applications/App.app

      - name: Package IPA
        run: |
          cd ios/App
          rm -rf Payload && mkdir Payload
          cp -R build/App.xcarchive/Products/Applications/App.app Payload/
          zip -qry ../../Nexus.ipa Payload
          ls -lh ../../Nexus.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Nexus-ipa
          path: mobile/Nexus.ipa

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ios-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Nexus.ipa --repo "$GITHUB_REPOSITORY" \
            --title "Nexus iOS build ${GITHUB_RUN_NUMBER}" \
            --notes "Unsigned IPA → install with Sideloadly using your Apple ID. Opens: ${NEXUS_URL}
          
          Updated shell with the current Nexus app icon (full AppIcon set from 1024px master)."
