name: Browser iOS app (.ipa)

# Standalone Nexus Browser.ipa (bundle hu.qyopy.browser) — Sideloadly / AltStore.
# Opens https://nexusproject.cc/browser/app — live search + Shields (web deploy updates UI).
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Browser web entry URL (leave empty for production /browser/app)"
        required: false
  push:
    branches: [main]
    paths:
      - "mobile-browser/**"
      - ".github/workflows/browser-ipa.yml"
      - ".github/scripts/fix-ios-framework-ids.sh"
  pull_request:
    paths:
      - "mobile-browser/**"
      - ".github/workflows/browser-ipa.yml"
      - ".github/scripts/fix-ios-framework-ids.sh"

permissions:
  contents: write

jobs:
  browser-ipa:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile-browser
    env:
      BROWSER_URL: ${{ github.event.inputs.url || vars.BROWSER_URL || 'https://nexusproject.cc/browser/app' }}
      NEXUS_URL: ${{ github.event.inputs.url || vars.BROWSER_URL || 'https://nexusproject.cc/browser/app' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Create iOS project
        run: |
          echo "Browser app will open: $BROWSER_URL"
          npx cap add ios
          npx cap sync ios
          ls ios/App

      - name: Icon and app settings
        run: |
          PLIST=ios/App/App/Info.plist
          pb() { /usr/libexec/PlistBuddy -c "$1" "$PLIST" 2>/dev/null || true; }
          pb "Set :CFBundleDisplayName Nexus Browser"
          pb "Add :CFBundleDisplayName string Nexus Browser"
          pb "Add :ITSAppUsesNonExemptEncryption bool false"
          pb "Add :UIStatusBarStyle string UIStatusBarStyleLightContent"
          pb "Add :UIViewControllerBasedStatusBarAppearance bool false"
          pb "Set :UIUserInterfaceStyle Dark"
          pb "Add :UIUserInterfaceStyle string Dark"
          pb "Set :CFBundleShortVersionString 1.${GITHUB_RUN_NUMBER}"
          pb "Add :CFBundleShortVersionString string 1.${GITHUB_RUN_NUMBER}"
          pb "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}"
          pb "Add :CFBundleVersion string ${GITHUB_RUN_NUMBER}"

          test -f resources/icon-1024.png
          ICONSET=ios/App/App/Assets.xcassets/AppIcon.appiconset
          mkdir -p "$ICONSET"
          cp resources/AppIcon.Contents.json "$ICONSET/Contents.json"
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          src = Path("resources/icon-1024.png")
          iconset = Path("ios/App/App/Assets.xcassets/AppIcon.appiconset")
          data = json.loads((iconset / "Contents.json").read_text())
          for img in data["images"]:
              w, h = img["size"].split("x")
              scale = int(img["scale"].replace("x", ""))
              px = int(round(float(w) * scale))
              out = iconset / img["filename"]
              subprocess.check_call(["sips", "-z", str(px), str(px), str(src), "--out", str(out)], stdout=subprocess.DEVNULL)
              print(out.name, px)
          PY

      - name: Build (unsigned)
        run: |
          cd ios/App
          # Do NOT pass PRODUCT_BUNDLE_IDENTIFIER — it stamps every framework with the
          # same id (Sideloadly DuplicateIdentifier). Capacitor appId sets the App target.
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            MARKETING_VERSION="1.${GITHUB_RUN_NUMBER}" CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            | tail -40
          test -d build/App.xcarchive/Products/Applications/App.app

      - name: Package IPA
        run: |
          cd ios/App
          APP=build/App.xcarchive/Products/Applications/App.app
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier hu.qyopy.browser" "$APP/Info.plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string hu.qyopy.browser" "$APP/Info.plist"
          bash "$GITHUB_WORKSPACE/.github/scripts/fix-ios-framework-ids.sh" "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry ../../NexusBrowser.ipa Payload
          ls -lh ../../NexusBrowser.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: NexusBrowser-ipa
          path: mobile-browser/NexusBrowser.ipa

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="browser-ios-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" NexusBrowser.ipa --repo "$GITHUB_REPOSITORY" \
            --title "Nexus Browser iOS build ${GITHUB_RUN_NUMBER}" \
            --notes "Standalone **Nexus Browser** IPA (bundle \`hu.qyopy.browser\`).

          Install with Sideloadly / AltStore using your Apple ID.
          Opens: ${BROWSER_URL}

          Searches Google via Nexus servers. Also available inside Nexus → Apps → Browser."
