name: Wump iOS app (.ipa)

# Standalone Wump.ipa (bundle hu.qyopy.bump) — Sideloadly / AltStore.
# Opens https://nexusproject.cc/wump/app — same Nexus account & backend.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Wump web entry URL (leave empty for production /wump/app)"
        required: false
  push:
    branches: [main]
    paths:
      - "mobile-bump/**"
      - ".github/workflows/bump-ipa.yml"
      - ".github/scripts/fix-ios-framework-ids.sh"
  pull_request:
    paths:
      - "mobile-bump/**"
      - ".github/workflows/bump-ipa.yml"
      - ".github/scripts/fix-ios-framework-ids.sh"

permissions:
  contents: write

jobs:
  bump-ipa:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile-bump
    env:
      BUMP_URL: ${{ github.event.inputs.url || vars.BUMP_URL || 'https://nexusproject.cc/wump/app' }}
      NEXUS_URL: ${{ github.event.inputs.url || vars.BUMP_URL || 'https://nexusproject.cc/wump/app' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Create iOS project
        run: |
          echo "Wump app will open: $BUMP_URL"
          npx cap add ios
          npx cap sync ios
          ls ios/App

      - name: Permissions, icon and app settings
        run: |
          PLIST=ios/App/App/Info.plist
          pb() { /usr/libexec/PlistBuddy -c "$1" "$PLIST" 2>/dev/null || true; }
          pb "Add :NSLocationWhenInUseUsageDescription string Wump uses your location so friends and family can find you nearby. Location is rounded and expires after 20 minutes."
          pb "Add :NSLocationAlwaysAndWhenInUseUsageDescription string Wump can refresh your pin in the background while you are Live, so family can keep finding you nearby. Turn Live off anytime to stop sharing."
          pb "Add :NSPhotoLibraryUsageDescription string Attach a photo to your Wump profile."
          pb "Add :UIBackgroundModes array"
          pb "Add :UIBackgroundModes:0 string location"
          pb "Add :UIBackgroundModes:1 string remote-notification"
          pb "Add :UIBackgroundModes:2 string fetch"
          pb "Add :UIBackgroundModes:3 string audio"
          # Sign in with Apple entitlement hint (unsigned Sideloadly still uses web OAuth fallback)
          pb "Add :CFBundleURLTypes array"
          pb "Add :CFBundleURLTypes:0 dict"
          pb "Add :CFBundleURLTypes:0:CFBundleURLSchemes array"
          pb "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string hu.qyopy.bump"
          pb "Set :CFBundleDisplayName Wump"
          pb "Add :CFBundleDisplayName string Wump"
          pb "Set :CFBundleName Wump"
          pb "Add :CFBundleName string Wump"
          pb "Add :ITSAppUsesNonExemptEncryption bool false"
          pb "Add :UIStatusBarStyle string UIStatusBarStyleLightContent"
          pb "Add :UIViewControllerBasedStatusBarAppearance bool false"
          pb "Set :UIUserInterfaceStyle Dark"
          pb "Add :UIUserInterfaceStyle string Dark"
          pb "Set :CFBundleShortVersionString 1.${GITHUB_RUN_NUMBER}"
          pb "Add :CFBundleShortVersionString string 1.${GITHUB_RUN_NUMBER}"
          pb "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}"
          pb "Add :CFBundleVersion string ${GITHUB_RUN_NUMBER}"

          test -f resources/icon-1024.png
          ICONSET=ios/App/App/Assets.xcassets/AppIcon.appiconset
          mkdir -p "$ICONSET"
          cp resources/AppIcon.Contents.json "$ICONSET/Contents.json"
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          src = Path("resources/icon-1024.png")
          iconset = Path("ios/App/App/Assets.xcassets/AppIcon.appiconset")
          data = json.loads((iconset / "Contents.json").read_text())
          for img in data["images"]:
              w, h = img["size"].split("x")
              scale = int(img["scale"].replace("x", ""))
              px = int(round(float(w) * scale))
              out = iconset / img["filename"]
              subprocess.check_call(["sips", "-z", str(px), str(px), str(src), "--out", str(out)], stdout=subprocess.DEVNULL)
              print(out.name, px)
          PY
          ls -la "$ICONSET"
          plutil -p "$PLIST" | head -60

      - name: Build (unsigned)
        run: |
          cd ios/App
          # Do NOT pass PRODUCT_BUNDLE_IDENTIFIER here — it stamps every embedded
          # framework (Cordova, Apple Sign In, Haptics…) with the same id and
          # Sideloadly fails with DuplicateIdentifier. Capacitor appId sets the App target.
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            MARKETING_VERSION="1.${GITHUB_RUN_NUMBER}" CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            | tail -40
          test -d build/App.xcarchive/Products/Applications/App.app

      - name: Package IPA
        run: |
          cd ios/App
          APP=build/App.xcarchive/Products/Applications/App.app
          # Ensure app id (Capacitor should already have set this)
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier hu.qyopy.bump" "$APP/Info.plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string hu.qyopy.bump" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Wump" "$APP/Info.plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Wump" "$APP/Info.plist"
          bash "$GITHUB_WORKSPACE/.github/scripts/fix-ios-framework-ids.sh" "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry ../../Wump.ipa Payload
          ls -lh ../../Wump.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Wump-ipa
          path: mobile-bump/Wump.ipa

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="wump-ios-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Wump.ipa --repo "$GITHUB_REPOSITORY" \
            --title "Wump iOS build ${GITHUB_RUN_NUMBER}" \
            --notes "Standalone **Wump** IPA (bundle \`hu.qyopy.bump\`).

          Install with Sideloadly / AltStore using your Apple ID.
          Opens: ${BUMP_URL}

          Friends, chat, live map, groups — same Nexus login & backend.
          Nexus chat app stays separate — Wump is also available inside Nexus."
