# One-upload deploys: upload drop.zip to the repo root (Add file > Upload files) and this unpacks it,
# clears the stray root folders that flattened uploads leave behind, commits, and Vercel redeploys.
name: Apply drop
on:
  push:
    branches: [main]
    paths: ["drop.zip"]
permissions:
  contents: write
concurrency:
  group: apply-drop
  cancel-in-progress: false
jobs:
  apply:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack drop.zip
        run: |
          set -euo pipefail
          test -f drop.zip
          mkdir /tmp/drop
          unzip -q drop.zip -d /tmp/drop
          # a zip made from a folder has one top folder: step into it
          n=$(ls -A /tmp/drop | wc -l)
          if [ "$n" = "1" ] && [ -d "/tmp/drop/$(ls -A /tmp/drop)" ] && [ ! -d /tmp/drop/src ]; then
            mv "/tmp/drop/$(ls -A /tmp/drop)" /tmp/drop2
            rm -rf /tmp/drop
            mv /tmp/drop2 /tmp/drop
          fi
          # safety: the app source must be inside, or stop before touching anything
          test -f /tmp/drop/src/lib/ipaServer.ts || { echo "drop.zip has no src/ folder"; exit 1; }
          # stray copies of src/* and supabase/* left at the root by flattened uploads
          # (Next.js would pick a root app/ over src/app and break the build)
          rm -rf app components lib store functions migrations workflows snap-ipa.yml
          rsync -a --exclude '.git' --exclude '.github' /tmp/drop/ ./
          rm -f drop.zip
      - name: Commit
        run: |
          git config user.name "nexus-drop"
          git config user.email "nexus-drop@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "nothing to change"; exit 0; }
          git commit -q -m "Apply drop: unpack drop.zip, remove stray root folders"
          git push
