name: Web build check

on:
  push:
    branches: [main]
    paths-ignore: ["mobile/**", "**.md"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://fcnabeudhdlugruqzezn.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ecL4KcIP0BqzxZeqJ4gLAA_YPT3ogtk
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Save lockfile
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
