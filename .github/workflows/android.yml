name: Android app (.apk / .aab)

# Builds Nexus for Android.
#  - Always: an installable APK (debug-signed) you can sideload on any Android phone.
#  - If the ANDROID_KEYSTORE_* secrets exist: a release-signed APK + AAB ready for Google Play.
# Triggers: Actions → Run workflow, or any push to main that touches mobile/.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Live site the app opens (leave empty to use the NEXUS_URL repo variable)"
        required: false
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    env:
      NEXUS_URL: ${{ github.event.inputs.url || vars.NEXUS_URL || 'https://nexusproject.cc' }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      # optional: Firebase google-services.json (whole file as a secret) → push notifications while the app is closed
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: |
          echo "App will open: $NEXUS_URL"
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then export NEXUS_FCM=1; echo "Firebase push: on"; else echo "Firebase push: off (local notifications only)"; fi
          npx cap add android
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json; fi
          npx cap sync android

      - name: Permissions, icon, version
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          if ! command -v convert >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends imagemagick
          fi
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # Bump (Geolocation) needs coarse + fine location; keep camera/mic/media for chat
          for p in RECORD_AUDIO MODIFY_AUDIO_SETTINGS CAMERA VIBRATE POST_NOTIFICATIONS READ_MEDIA_IMAGES READ_MEDIA_VIDEO READ_MEDIA_AUDIO ACCESS_COARSE_LOCATION ACCESS_FINE_LOCATION; do
            grep -q "android.permission.$p\"" "$MANIFEST" || sed -i "s#<application#<uses-permission android:name=\"android.permission.$p\" />\n    <application#" "$MANIFEST"
          done
          grep -q 'android.hardware.camera"' "$MANIFEST" || sed -i 's#<application#<uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' "$MANIFEST"
          grep -n "uses-" "$MANIFEST"

          # app icon (legacy PNGs everywhere; drop adaptive XML so ours is used)
          test -f resources/icon-1024.png
          RES=android/app/src/main/res
          rm -rf "$RES/mipmap-anydpi-v26"
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dir="$RES/mipmap-${d%%:*}"; size="${d##*:}"; mkdir -p "$dir"
            convert resources/icon-1024.png -resize ${size}x${size} "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_foreground.png"
          done

          # version: 1.<run number>
          GRADLE=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${GITHUB_RUN_NUMBER}/" "$GRADLE"
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.${GITHUB_RUN_NUMBER}\"/" "$GRADLE"
          grep -n "version" "$GRADLE"

      - name: Build debug APK (sideload)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Nexus.apk
          ls -lh ../Nexus.apk

      - name: Build signed release (Google Play)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/nexus.jks"
          cd android
          ./gradlew --no-daemon bundleRelease assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/nexus.jks" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"
          cp app/build/outputs/bundle/release/app-release.aab ../Nexus-release.aab
          cp app/build/outputs/apk/release/app-release.apk ../Nexus-release.apk
          ls -lh ../Nexus-release.*

      - uses: actions/upload-artifact@v4
        with:
          name: Nexus-android
          path: |
            mobile/Nexus.apk
            mobile/Nexus-release.aab
            mobile/Nexus-release.apk
          if-no-files-found: ignore

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-${GITHUB_RUN_NUMBER}"
          FILES="Nexus.apk"
          [ -f Nexus-release.aab ] && FILES="$FILES Nexus-release.aab Nexus-release.apk"
          gh release create "$TAG" $FILES --repo "$GITHUB_REPOSITORY" \
            --title "Nexus Android build ${GITHUB_RUN_NUMBER}" \
            --notes "Nexus.apk → install on any Android phone (allow 'Install unknown apps'). Opens: ${NEXUS_URL}
          
          Updated shell with the current Nexus app icon (1024px source → launcher mipmaps)."
