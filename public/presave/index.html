<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0c0d12" />
    <meta name="description" content="Your next release starts here. Create unlimited, personalized music pre-save pages with Nexus by qyopyy." />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <script>
      // Served from /p/<slug> or a creator's own domain: keep ./styles.css, ./app.mjs etc. pointing at /presave/.
      (function () {
        if (/\/presave(\/|$)/.test(location.pathname)) return;
        var base = document.createElement('base');
        base.href = '/presave/';
        document.head.appendChild(base);
        document.documentElement.setAttribute('data-presave-root', '1');
        // A <base> makes "#main" resolve to /presave/#main; keep in-page links in-page.
        document.addEventListener('click', function (event) {
          var link = event.target.closest && event.target.closest('a[href^="#"]');
          if (!link || event.defaultPrevented) return;
          var target = document.getElementById(decodeURIComponent(link.getAttribute('href').slice(1)));
          event.preventDefault();
          if (target) { target.focus({ preventScroll: true }); target.scrollIntoView(); }
        });
      })();
    </script>
    <title>Nexus Pre-save — by qyopyy</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./config.js"></script>
    <script type="module" src="./app.mjs"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="app"></div>
    <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
    <dialog id="auth-dialog" class="modal" aria-label="Nexus account"></dialog>
    <dialog id="confirm-dialog" class="modal" aria-label="Confirm campaign action"></dialog>
    <noscript>
      <div class="error-panel">Nexus Pre-save needs JavaScript to manage campaigns and securely connect to Spotify. Please enable JavaScript and reload this page.</div>
    </noscript>
  </body>
</html>
