<!doctype html>
<meta charset="utf-8">
<style>
  body{margin:0;width:300px;font:14px system-ui,sans-serif;background:#1e1f22;color:#f2f3f5}
  main{padding:14px;display:grid;gap:10px}
  h1{font-size:15px;margin:0}
  button{border:0;border-radius:999px;padding:9px 14px;font:600 13px system-ui;background:#5865f2;color:#fff;cursor:pointer}
  button.q{background:#3f4147}
  button:disabled{opacity:.5;cursor:default}
  .row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#b5bac1}
  .ok{color:#23a55a}.bad{color:#f23f43}
  #msg{min-height:16px;font-size:12px;color:#b5bac1}
  label{display:flex;gap:8px;align-items:center;font-size:13px}
</style>
<main>
  <h1>Nexus Bridge</h1>
  <div class="row"><span>Nexus tab</span><span id="tab" class="bad">checking…</span></div>
  <div class="row"><span>Clip</span><span id="clip">–</span></div>
  <div class="row"><span>Pass</span><span id="pass">–</span></div>
  <button id="send">Send this tab to my devices</button>
  <button id="clipb" class="q">Send my clipboard</button>
  <label><input type="checkbox" id="watch"> Watch clipboard in the background</label>
  <div id="msg" role="status"></div>
</main>
<script src="popup.js"></script>
